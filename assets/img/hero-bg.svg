<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Night motorway scene used as the hero background (works offline, ~6KB).
       PLACEHOLDER: replace with client's real photo -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset=".55" stop-color="#121826"/>
      <stop offset=".72" stop-color="#2A2416"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161A"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy=".7" r=".5">
      <stop offset="0" stop-color="#FFB000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beacon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFC800" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#FF9A00" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF9A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trailRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="trailWhite" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF4D6" stop-opacity=".85"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#fff" opacity=".5">
    <circle cx="120" cy="80" r="1.2"/><circle cx="340" cy="150" r="1"/><circle cx="520" cy="60" r="1.4"/>
    <circle cx="760" cy="120" r="1"/><circle cx="980" cy="70" r="1.2"/><circle cx="1180" cy="140" r="1"/>
    <circle cx="1400" cy="90" r="1.3"/><circle cx="1520" cy="200" r="1"/><circle cx="240" cy="260" r="1"/>
    <circle cx="1300" cy="260" r="1.1"/>
  </g>

  <!-- distant hills / town skyline -->
  <path d="M0 620 L90 600 L160 612 L240 585 L330 605 L420 590 L520 610 L600 598 L700 612 L800 604 L900 612 L1010 595 L1100 610 L1210 588 L1300 606 L1400 592 L1500 608 L1600 596 L1600 660 L0 660Z" fill="#0B0D12"/>
  <g fill="#0E1118">
    <rect x="180" y="560" width="40" height="70"/><rect x="226" y="575" width="30" height="55"/>
    <rect x="1240" y="548" width="36" height="82"/><rect x="1282" y="568" width="44" height="62"/>
    <rect x="1336" y="580" width="26" height="50"/>
  </g>
  <g fill="#FFC86A" opacity=".55">
    <rect x="190" y="575" width="5" height="5"/><rect x="204" y="590" width="5" height="5"/><rect x="236" y="590" width="4" height="4"/>
    <rect x="1250" y="565" width="5" height="5"/><rect x="1262" y="585" width="5" height="5"/><rect x="1296" y="585" width="4" height="4"/>
  </g>

  <!-- street lights glow along the motorway -->
  <g filter="url(#blur6)" fill="#FFB347" opacity=".55">
    <circle cx="560" cy="560" r="10"/><circle cx="660" cy="586" r="8"/><circle cx="730" cy="603" r="6"/>
    <circle cx="1040" cy="560" r="10"/><circle cx="940" cy="586" r="8"/><circle cx="870" cy="603" r="6"/>
  </g>

  <!-- dark ground either side of the motorway -->
  <rect y="640" width="1600" height="360" fill="#0A0B0E"/>
  <rect y="640" width="1600" height="60" fill="#1A1610" opacity=".8"/>

  <!-- motorway in perspective -->
  <path d="M760 630 L840 630 L1600 1000 L0 1000Z" fill="url(#road)"/>
  <path d="M0 1000 L760 630 L770 630 L40 1000Z" fill="#2B2B2B" opacity=".6"/>
  <path d="M1600 1000 L840 630 L830 630 L1560 1000Z" fill="#2B2B2B" opacity=".6"/>
  <!-- lane dashes -->
  <g fill="#FFC800" opacity=".75">
    <path d="M797 640 L803 640 L805 655 L795 655Z"/>
    <path d="M794 675 L806 675 L809 700 L791 700Z"/>
    <path d="M788 735 L812 735 L817 775 L783 775Z"/>
    <path d="M778 830 L822 830 L832 900 L768 900Z"/>
  </g>
  <g fill="#E8E8E8" opacity=".35">
    <path d="M640 690 L650 690 L630 720 L618 720Z"/><path d="M560 770 L576 770 L545 815 L527 815Z"/>
    <path d="M960 690 L950 690 L970 720 L982 720Z"/><path d="M1040 770 L1024 770 L1055 815 L1073 815Z"/>
  </g>

  <!-- light trails -->
  <g filter="url(#blur2)">
    <path d="M200 1000 C 520 800, 700 690, 790 636" stroke="url(#trailRed)" stroke-width="5" fill="none"/>
    <path d="M300 1000 C 580 810, 720 700, 794 640" stroke="url(#trailRed)" stroke-width="3" fill="none" opacity=".7"/>
    <path d="M1400 1000 C 1080 800, 900 690, 810 636" stroke="url(#trailWhite)" stroke-width="5" fill="none"/>
    <path d="M1300 1000 C 1030 810, 880 700, 806 640" stroke="url(#trailWhite)" stroke-width="3" fill="none" opacity=".7"/>
  </g>

  <!-- tow truck silhouette on the hard shoulder -->
  <g transform="translate(1050 640) scale(1.9)">
    <ellipse cx="120" cy="104" rx="140" ry="10" fill="#000" opacity=".6"/>
    <!-- flatbed + car -->
    <rect x="0" y="62" width="150" height="10" rx="2" fill="#1B1B1B"/>
    <rect x="0" y="62" width="150" height="2.5" fill="#FFC800" opacity=".85"/>
    <path d="M14 60c0-6 4-10 10-11l14-2 14-12h38l16 13c8 1 12 5 12 12z" fill="#22252B"/>
    <path d="M56 37h14v11H44zM74 37h14l12 11H74z" fill="#3A4656"/>
    <!-- chassis -->
    <rect x="0" y="72" width="232" height="14" rx="3" fill="#0D0D0D"/>
    <!-- cab -->
    <path d="M156 38h42c6 0 9 2 12 6l14 16c3 3 4 6 4 10v6H156z" fill="#C99A00"/>
    <path d="M168 44h26l13 15h-39z" fill="#14171C"/>
    <rect x="156" y="31" width="22" height="7" rx="2" fill="#B88C00"/>
    <rect x="160" y="26" width="14" height="5" rx="2" fill="#FFC800"/>
    <!-- wheels -->
    <circle cx="36" cy="88" r="12" fill="#050505"/><circle cx="36" cy="88" r="4" fill="#3A3A3A"/>
    <circle cx="116" cy="88" r="12" fill="#050505"/><circle cx="116" cy="88" r="4" fill="#3A3A3A"/>
    <circle cx="202" cy="88" r="12" fill="#050505"/><circle cx="202" cy="88" r="4" fill="#3A3A3A"/>
    <!-- headlight -->
    <rect x="222" y="64" width="8" height="6" rx="1" fill="#FFF6D8"/>
  </g>
  <!-- beacon + headlight glows -->
  <circle cx="1371" cy="695" r="120" fill="url(#beacon)"/>
  <circle cx="1497" cy="767" r="70" fill="url(#head)" opacity=".7"/>
  <path d="M1500 760 L1600 720 L1600 830Z" fill="#FFF6D8" opacity=".08"/>

  <!-- hazard triangle on the road -->
  <g transform="translate(980 850)">
    <path d="M0 40 L23 0 L46 40Z" fill="none" stroke="#FF3B3B" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
